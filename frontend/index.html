<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hep - Переводчик для мастеров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf9f7;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT COLUMN - 8 characters width */
        .orders-column {
            width: 80px;
            background: #fffcf7;
            border-right: 1px solid #e8e3db;
            display: flex;
            flex-direction: column;
        }

        .orders-header {
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 600;
    border-bottom: 1px solid #e8e3db;
    color: #3d5a80;
    text-align: center;
}

        .orders-search {
            padding: 8px;
            border-bottom: 1px solid #e8e3db;
        }

        .orders-search input {
            width: 100%;
            padding: 4px;
            border: 1px solid #e8e3db;
            border-radius: 4px;
            font-size: 11px;
        }

        .orders-list {
            flex: 1;
            overflow-y: auto;
        }

        .order-item {
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-item:hover {
            background: #f8f6f0;
        }

        .sync-button {
            padding: 8px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin: 8px;
        }

        .sync-button:hover {
            background: #43a047;
        }

        /* RIGHT COLUMN - Adaptive width */
        .translate-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: 0;
            overflow: hidden;
        }

        .order-info {
            margin-bottom: 16px;
            padding-top: 12px;
        }

        .order-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }

        .order-number {
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .order-meta {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            font-size: 12px;
            line-height: 1.4;
            flex: 1;
        }

        .meta-tag {
            background: #f0e8d8;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .meta-tag a {
            color: inherit;
            text-decoration: underline;
        }

        .meta-tag a:hover {
            opacity: 0.8;
        }

        .translate-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            margin-bottom: 16px;
        }

        .translate-section:last-of-type {
            margin-bottom: 0;
        }

        .translate-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e3db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            flex: 1;
            min-height: 100px;
            overflow-y: auto;
        }

        textarea:focus {
            outline: none;
            border-color: #222;
        }

        .russian-field {
            background: #fff;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-send {
            margin-left: auto;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-help,
        .btn-pricing {
            width: 45px;
            height: 45px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-help {
            background: #ffa726;
            color: white;
        }

        .btn-help:hover {
            background: #f57c00;
        }

        .btn-pricing {
            background: #66bb6a;
            color: white;
        }

        .btn-pricing:hover {
            background: #43a047;
        }

        .btn-send {
            background: #222;
            color: white;
            padding: 12px 18px;
            white-space: nowrap;
            min-width: auto;
        }

        .btn-send:hover {
            background: #000;
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0.7);
            }
            50% {
                opacity: 0.7;
                box-shadow: 0 0 10px 5px rgba(255, 167, 38, 0);
            }
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(255, 167, 38, 0);
            }
        }

        /* Login Screen */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #faf9f7;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 320px;
        }

        .login-box h1 {
            margin: 0 0 24px 0;
            font-size: 24px;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e3db;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .login-box button:hover {
            background: #43a047;
        }

        #loginError {
            color: #ef5350;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
 /* Images preview - compact */
.images-container {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 8px;
}

.image-item {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #e8e3db;
}

.image-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.image-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 10px;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image-remove:hover {
    background: rgba(239,83,80,0.9);
}

/* Upload button inside textarea */
.translate-section {
    position: relative;
}

.btn-upload-inline {
    position: absolute;
    bottom: 28px;
    right: 8px;
    width: 24px;
    height: 24px;
    padding: 0;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 10;
}

.translate-section:hover .btn-upload-inline {
    opacity: 0.4;
}

.btn-upload-inline:hover {
    opacity: 1 !important;
}

textarea.drag-over {
    border-color: #4caf50;
    background: #f0f8f0;
}

.btn-upload {
    width: 45px;
    height: 45px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: #42a5f5;
    color: white;
}

.btn-upload:hover {
    background: #1e88e5;
}
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <h1>Вход в Hep</h1>
            <input type="password" id="passwordInput" placeholder="Введите пароль" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">Войти</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- Main App (hidden until logged in) -->
    <div id="mainApp" style="display: none;">
        <div class="container">
            <!-- LEFT COLUMN -->
            <div class="orders-column">
    <div class="orders-header">hep</div>
    <div class="orders-search">
        <input type="text" id="searchInput" placeholder="">
    </div>
    <button class="sync-button" onclick="syncNotion()">Sync</button>
    <button class="sync-button" style="background: #9e9e9e; margin-top: 0;" onclick="deselectOrder()">×</button>
    <div class="orders-list" id="ordersList">
                    <!-- Orders will be loaded here -->
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="translate-column">
                <div class="order-info" id="orderInfo">
                    <div class="order-header">
                        <div class="order-number" id="orderNumber">Выберите заказ</div>
                        <div class="order-meta" id="orderMeta">
                            <!-- Meta tags will appear here -->
                        </div>
                    </div>
                </div>

               <div class="translate-section">
    <div class="translate-label">Оригинал</div>
    <textarea id="englishText" placeholder="Вставьте текст от клиента..."></textarea>
</div>

<div class="translate-section">
    <div class="translate-label">Перевод</div>
    <textarea 
        id="russianText" 
        class="russian-field" 
        placeholder="Перевод появится здесь автоматически..."
        ondrop="handleDrop(event)" 
        ondragover="handleDragOver(event)" 
        ondragleave="handleDragLeave(event)">
    </textarea>
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleFileSelect(event)">
    <button class="btn-upload-inline" onclick="document.getElementById('fileInput').click()" title="Прикрепить (📎 / Ctrl+V / перетащить)">📎</button>
    <div id="imagesContainer" class="images-container"></div>
</div>

<div class="buttons-row">
    <button class="btn-help" onclick="toggleSend('problems', this)">?</button>
    <button class="btn-pricing" onclick="toggleSend('pricing', this)">💰</button>
    <button class="btn-send" id="sendButton" onclick="toggleSend('master', this)">➤ Отправить</button>
</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://hep-backend.onrender.com';
        
        // State
        let currentOrder = null;
        let orders = [];
        let translateTimeout = null;
        let pendingSends = [];
        let authToken = null;
        let attachedImages = []; // Array of base64 images

        // Initialize - check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            authToken = localStorage.getItem('hep_auth_token');
            if (authToken) {
                // Already logged in
                showMainApp();
            }
        });

        async function login() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!password) {
                errorDiv.textContent = 'Введите пароль';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token;
                    localStorage.setItem('hep_auth_token', authToken);
                    showMainApp();
                } else {
                    errorDiv.textContent = 'Неверный пароль';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка подключения';
                errorDiv.style.display = 'block';
            }
        }

        function showMainApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadOrders();
            setupEventListeners();
            setupImageHandlers();
        }

        function setupEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterOrders(e.target.value);
            });

            // Auto-translate with debounce
            document.getElementById('englishText').addEventListener('input', () => {
                clearTimeout(translateTimeout);
                translateTimeout = setTimeout(autoTranslate, 1000);
            });
        }

        // Image handling functions
        function setupImageHandlers() {
            // Paste from clipboard
            document.addEventListener('paste', handlePaste);
        }

        function handlePaste(e) {
    const items = e.clipboardData?.items;
    if (!items) return;
    
    let imagesToAdd = 0;
    for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
            imagesToAdd++;
        }
    }
    
    const availableSlots = 10 - attachedImages.length;
    if (imagesToAdd > availableSlots) {
        alert(`Можно добавить ещё только ${availableSlots} картинок (максимум 10 всего)`);
        e.preventDefault();
        return;
    }
    
    for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
            e.preventDefault();
            const file = item.getAsFile();
            addImageFile(file);
        }
    }
}

        function handleFileSelect(e) {
    const files = Array.from(e.target.files);
    const availableSlots = 10 - attachedImages.length;
    
    if (files.length > availableSlots) {
        alert(`Можно добавить ещё только ${availableSlots} картинок (максимум 10 всего)`);
        e.target.value = '';
        return;
    }
    
    for (let file of files) {
        addImageFile(file);
    }
    e.target.value = '';
}

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.target.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            e.target.classList.remove('drag-over');
        }

        function handleDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    e.target.classList.remove('drag-over');
    
    const files = e.dataTransfer.files;
    const imageFiles = Array.from(files).filter(f => f.type.indexOf('image') !== -1);
    const availableSlots = 10 - attachedImages.length;
    
    if (imageFiles.length > availableSlots) {
        alert(`Можно добавить ещё только ${availableSlots} картинок (максимум 10 всего)`);
        return;
    }
    
    for (let file of imageFiles) {
        addImageFile(file);
    }
}

        function addImageFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        attachedImages.push(e.target.result);
        renderImages();
    };
    reader.readAsDataURL(file);
}

        function removeImage(index) {
            attachedImages.splice(index, 1);
            renderImages();
        }

        function renderImages() {
            const container = document.getElementById('imagesContainer');
            
            if (attachedImages.length === 0) {
                container.innerHTML = '';
            } else {
                container.innerHTML = attachedImages.map((img, index) => `
                    <div class="image-item">
                        <img src="${img}" alt="Image ${index + 1}">
                        <button class="image-remove" onclick="removeImage(${index})">×</button>
                    </div>
                `).join('');
            }
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/api/orders/`);
                orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error('Failed to load orders:', error);
            }
        }

        function renderOrders(ordersToRender) {
            // Sort by order_number descending (like Notion)
            const sorted = [...ordersToRender].sort((a, b) => {
                return b.order_number.localeCompare(a.order_number, 'ru');
            });
            
            const container = document.getElementById('ordersList');
            container.innerHTML = sorted.map(order => `
                <div class="order-item" onclick="selectOrder('${order.order_number}')">
                    ${order.order_number}
                </div>
            `).join('');
        }

        function filterOrders(search) {
            if (!search) {
                renderOrders(orders);
                return;
            }
            
            const filtered = orders.filter(order => 
                order.order_number.toLowerCase().includes(search.toLowerCase()) ||
                (order.etsy_link && order.etsy_link.includes(search))
            );
            renderOrders(filtered);
        }

        async function selectOrder(orderNumber) {
    try {
        const response = await fetch(`${API_URL}/api/orders/${orderNumber}`);
        currentOrder = await response.json();
        displayOrderInfo();
        
        // Highlight selected order
        document.querySelectorAll('.order-item').forEach(item => {
            item.style.background = '';
            item.style.borderLeft = '';
        });
        
        // Find and highlight the clicked item
        const selectedItem = Array.from(document.querySelectorAll('.order-item')).find(
            item => item.textContent.trim() === orderNumber
        );
        if (selectedItem) {
            selectedItem.style.background = '#d4f4dd';
        }
    } catch (error) {
        console.error('Failed to load order:', error);
    }
}

        function displayOrderInfo() {
            if (!currentOrder) return;

            document.getElementById('orderNumber').textContent = currentOrder.order_number;
            
            const metaTags = [];
            // Order: Мастер, сумма етси, нужен к, дата мастера, состав, ссылка етси
            if (currentOrder.master) metaTags.push(`<span class="meta-tag">${currentOrder.master}</span>`);
            if (currentOrder.sum_etsy) metaTags.push(`<span class="meta-tag">${currentOrder.sum_etsy}</span>`);
            if (currentOrder.deadline) metaTags.push(`<span class="meta-tag">Нужен к: ${formatDate(currentOrder.deadline)}</span>`);
            if (currentOrder.master_date) metaTags.push(`<span class="meta-tag">Дата мастера: ${formatDate(currentOrder.master_date)}</span>`);
            if (currentOrder.tags) metaTags.push(`<span class="meta-tag">${currentOrder.tags}</span>`);
            if (currentOrder.etsy_link) metaTags.push(`<span class="meta-tag"><a href="${currentOrder.etsy_link}" target="_blank">etsy</a></span>`);
            
            document.getElementById('orderMeta').innerHTML = metaTags.join('');
            
            // Update send button
            const masterCode = extractMasterCode(currentOrder.master);
            document.getElementById('sendButton').textContent = `➤ ${masterCode || 'Мастер'}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function extractMasterCode(masterStr) {
            if (!masterStr) return null;
            const match = masterStr.match(/^[A-Z0-9]+/);
            return match ? match[0] : null;
        }

        async function autoTranslate() {
    const englishText = document.getElementById('englishText').value.trim();
    if (!englishText) return;

    try {
        const response = await fetch(`${API_URL}/api/translate/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: englishText,
                direction: 'to_russian',
                order_number: currentOrder ? currentOrder.order_number : 'unknown'
            })
        });
        
        const data = await response.json();
        // Add order number only if order is selected
        if (currentOrder) {
            document.getElementById('russianText').value = `${currentOrder.order_number}\n${data.translation}`;
        } else {
            document.getElementById('russianText').value = data.translation;
        }
    } catch (error) {
        console.error('Translation failed:', error);
    }
}

        function toggleSend(type, button) {
            // Check if this button already has a countdown
            const existing = pendingSends.find(s => s.button === button);
            
            if (existing) {
                // Cancel this send
                console.log('Cancelling send to:', type);
                clearInterval(existing.countdown);
                restoreButton(button, type);
                pendingSends = pendingSends.filter(s => s.button !== button);
            } else {
                // Start new countdown
                startCountdown(type, button);
            }
        }

        function startCountdown(type, button) {
            if (!currentOrder) {
                alert('Выберите заказ');
                return;
            }

            const message = document.getElementById('russianText').value.trim();
            if (!message) {
                alert('Введите текст для отправки');
                return;
            }

            // Determine destination
            let destination;
            if (type === 'problems') {
                destination = 'problems';
            } else if (type === 'pricing') {
                destination = 'pricing';
            } else if (type === 'master') {
                destination = extractMasterCode(currentOrder.master);
                if (!destination) {
                    alert('Мастер не назначен');
                    return;
                }
            }

            const sendId = Date.now();
            let timeLeft = 10;
            button.textContent = timeLeft;
            
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    button.textContent = timeLeft;
                } else {
                    // Timer finished - send message
                    clearInterval(countdown);
                    sendMessage(destination, message);
                    restoreButton(button, type);
                    pendingSends = pendingSends.filter(s => s.id !== sendId);
                }
            }, 1000);

            // Add to pending sends
            pendingSends.push({
                id: sendId,
                type: type,
                destination: destination,
                button: button,
                countdown: countdown
            });
        }

        async function sendMessage(destination, message) {
    try {
        const response = await fetch(`${API_URL}/api/telegram/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_number: currentOrder ? currentOrder.order_number : 'unknown',
                destination: destination,
                message: message,
                images: attachedImages.length > 0 ? attachedImages : null
            })
        });

        const data = await response.json();
        
        if (data.success) {
            console.log(`✓ Sent to ${destination}`);
            // Clear fields after successful send
            clearFields();
        } else {
            console.error(`Error: ${data.error}`);
        }
    } catch (error) {
        console.error('Send failed:', error);
    }
}

        function restoreButton(button, type) {
            if (!button) return;
            
            if (type === 'problems') {
                button.textContent = '?';
            } else if (type === 'pricing') {
                button.textContent = '💰';
            } else if (type === 'master') {
                const masterCode = extractMasterCode(currentOrder?.master);
                button.textContent = `➤ ${masterCode || 'Мастер'}`;
            }
        }

        function clearFields() {
            document.getElementById('englishText').value = '';
            document.getElementById('russianText').value = '';
            attachedImages = [];
            renderImages();
        }

        async function syncNotion() {
            const button = document.querySelector('.sync-button');
            
            // Change to yellow with "Wait..."
            button.style.background = '#ffa726';
            button.textContent = 'Wait...';
            button.disabled = true;
            
            // Add pulsing animation
            button.style.animation = 'pulse 1.5s ease-in-out infinite';

            try {
                const response = await fetch(`${API_URL}/api/orders/sync-notion`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    console.log(`✓ Synced: ${data.synced_count} orders`);
                    await loadOrders();
                    
                    // Show success state
                    button.style.background = '#4caf50';
                    button.style.animation = 'none';
                    button.textContent = '✓ Done';
                    
                    // Return to normal after 2 seconds
                    setTimeout(() => {
                        button.style.background = '#4caf50';
                        button.textContent = 'Sync';
                        button.disabled = false;
                    }, 2000);
                }
            } catch (error) {
                console.error('Sync failed:', error);
                
                // Show error state
                button.style.background = '#ef5350';
                button.style.animation = 'none';
                button.textContent = '✗ Error';
                
                setTimeout(() => {
                    button.style.background = '#4caf50';
                    button.textContent = 'Sync';
                    button.disabled = false;
                }, 2000);
            }
        }
        function deselectOrder() {
    currentOrder = null;
    document.getElementById('orderNumber').textContent = 'Выберите заказ';
    document.getElementById('orderMeta').innerHTML = '';
    document.getElementById('sendButton').textContent = '➤ Отправить';
    
    // Clear active selection visual
    document.querySelectorAll('.order-item').forEach(item => {
        item.style.background = '';
    });
}
    </script>
