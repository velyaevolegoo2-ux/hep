<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hep - Переводчик для мастеров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf9f7;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT COLUMN - 8 characters width */
        .orders-column {
            width: 80px;
            background: #fffcf7;
            border-right: 1px solid #e8e3db;
            display: flex;
            flex-direction: column;
        }

        .orders-header {
            padding: 12px 8px;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid #e8e3db;
        }

        .orders-search {
            padding: 8px;
            border-bottom: 1px solid #e8e3db;
        }

        .orders-search input {
            width: 100%;
            padding: 4px;
            border: 1px solid #e8e3db;
            border-radius: 4px;
            font-size: 11px;
        }

        .orders-list {
            flex: 1;
            overflow-y: auto;
        }

        .order-item {
            padding: 8px;
            font-size: 11px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:hover {
            background: #f8f6f0;
        }

        .sync-button {
            padding: 8px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin: 8px;
        }

        .sync-button:hover {
            background: #43a047;
        }

        /* RIGHT COLUMN - Adaptive width */
        .translate-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: 0;
            overflow: hidden;
        }

        .order-info {
            margin-bottom: 16px;
            padding-top: 12px;
        }

        .order-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }

        .order-number {
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .order-meta {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            font-size: 12px;
            line-height: 1.4;
            flex: 1;
        }

        .meta-tag {
            background: #f0e8d8;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .meta-tag a {
            color: inherit;
            text-decoration: underline;
        }

        .meta-tag a:hover {
            opacity: 0.8;
        }

        .translate-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            margin-bottom: 16px;
        }

        .translate-section:last-of-type {
            margin-bottom: 0;
        }

        .translate-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e3db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            flex: 1;
            min-height: 100px;
            overflow-y: auto;
        }

        textarea:focus {
            outline: none;
            border-color: #222;
        }

        .russian-field {
            background: #fff;
        }

        .buttons-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-send {
            margin-left: auto;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-help,
        .btn-pricing {
            width: 45px;
            height: 45px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-help {
            background: #ffa726;
            color: white;
        }

        .btn-help:hover {
            background: #f57c00;
        }

        .btn-pricing {
            background: #66bb6a;
            color: white;
        }

        .btn-pricing:hover {
            background: #43a047;
        }

        .btn-send {
            background: #222;
            color: white;
            padding: 12px 18px;
            white-space: nowrap;
            min-width: auto;
        }

        .btn-send:hover {
            background: #000;
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LEFT COLUMN -->
        <div class="orders-column">
            <div class="orders-header">Заказы</div>
            <div class="orders-search">
                <input type="text" id="searchInput" placeholder="">
            </div>
            <button class="sync-button" onclick="syncNotion()">Sync</button>
            <div class="orders-list" id="ordersList">
                <!-- Orders will be loaded here -->
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="translate-column">
            <div class="order-info" id="orderInfo">
                <div class="order-header">
                    <div class="order-number" id="orderNumber">Выберите заказ</div>
                    <div class="order-meta" id="orderMeta">
                        <!-- Meta tags will appear here -->
                    </div>
                </div>
            </div>

            <div class="translate-section">
                <div class="translate-label">Английский (оригинал)</div>
                <textarea id="englishText" placeholder="Вставьте текст от клиента на английском..."></textarea>
            </div>

            <div class="translate-section">
                <div class="translate-label">Русский (для мастера)</div>
                <textarea id="russianText" class="russian-field" placeholder="Перевод появится здесь автоматически..."></textarea>
            </div>

            <div class="buttons-row">
                <button class="btn-help" onclick="toggleSend('problems', this)">?</button>
                <button class="btn-pricing" onclick="toggleSend('pricing', this)">💰</button>
                <button class="btn-send" id="sendButton" onclick="toggleSend('master', this)">➤ Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://hep-backend.onrender.com'; // Will be replaced with production URL
        
        // State
        let currentOrder = null;
        let orders = [];
        let translateTimeout = null;
        let pendingSends = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                filterOrders(e.target.value);
            });

            // Auto-translate with debounce
            document.getElementById('englishText').addEventListener('input', () => {
                clearTimeout(translateTimeout);
                translateTimeout = setTimeout(autoTranslate, 1000);
            });
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/api/orders/`);
                orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                console.error('Failed to load orders:', error);
            }
        }

        function renderOrders(ordersToRender) {
            const container = document.getElementById('ordersList');
            container.innerHTML = ordersToRender.map(order => `
                <div class="order-item" onclick="selectOrder('${order.order_number}')">
                    ${order.order_number}
                </div>
            `).join('');
        }

        function filterOrders(search) {
            if (!search) {
                renderOrders(orders);
                return;
            }
            
            const filtered = orders.filter(order => 
                order.order_number.toLowerCase().includes(search.toLowerCase()) ||
                (order.etsy_link && order.etsy_link.includes(search))
            );
            renderOrders(filtered);
        }

        async function selectOrder(orderNumber) {
            try {
                const response = await fetch(`${API_URL}/api/orders/${orderNumber}`);
                currentOrder = await response.json();
                displayOrderInfo();
            } catch (error) {
                console.error('Failed to load order:', error);
            }
        }

        function displayOrderInfo() {
            if (!currentOrder) return;

            document.getElementById('orderNumber').textContent = currentOrder.order_number;
            
            const metaTags = [];
            // Order: Мастер, сумма етси, нужен к, дата мастера, состав, ссылка етси
            if (currentOrder.master) metaTags.push(`<span class="meta-tag">${currentOrder.master}</span>`);
            if (currentOrder.sum_etsy) metaTags.push(`<span class="meta-tag">${currentOrder.sum_etsy}</span>`);
            if (currentOrder.deadline) metaTags.push(`<span class="meta-tag">Нужен к: ${formatDate(currentOrder.deadline)}</span>`);
            if (currentOrder.master_date) metaTags.push(`<span class="meta-tag">Дата мастера: ${formatDate(currentOrder.master_date)}</span>`);
            if (currentOrder.tags) metaTags.push(`<span class="meta-tag">${currentOrder.tags}</span>`);
            if (currentOrder.etsy_link) metaTags.push(`<span class="meta-tag"><a href="${currentOrder.etsy_link}" target="_blank">etsy</a></span>`);
            
            document.getElementById('orderMeta').innerHTML = metaTags.join('');
            
            // Update send button
            const masterCode = extractMasterCode(currentOrder.master);
            document.getElementById('sendButton').textContent = `➤ ${masterCode || 'Мастер'}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function extractMasterCode(masterStr) {
            if (!masterStr) return null;
            const match = masterStr.match(/^[A-Z0-9]+/);
            return match ? match[0] : null;
        }

        async function autoTranslate() {
            const englishText = document.getElementById('englishText').value.trim();
            if (!englishText || !currentOrder) return;

            try {
                const response = await fetch(`${API_URL}/api/translate/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: englishText,
                        direction: 'to_russian',
                        order_number: currentOrder.order_number
                    })
                });
                
                const data = await response.json();
                document.getElementById('russianText').value = data.translation;
            } catch (error) {
                console.error('Translation failed:', error);
            }
        }

        function toggleSend(type, button) {
            // Check if this button already has a countdown
            const existing = pendingSends.find(s => s.button === button);
            
            if (existing) {
                // Cancel this send
                console.log('Cancelling send to:', type);
                clearInterval(existing.countdown);
                restoreButton(button, type);
                pendingSends = pendingSends.filter(s => s.button !== button);
            } else {
                // Start new countdown
                startCountdown(type, button);
            }
        }

        function startCountdown(type, button) {
            if (!currentOrder) {
                alert('Выберите заказ');
                return;
            }

            const message = document.getElementById('russianText').value.trim();
            if (!message) {
                alert('Введите текст для отправки');
                return;
            }

            // Determine destination
            let destination;
            if (type === 'problems') {
                destination = 'problems';
            } else if (type === 'pricing') {
                destination = 'pricing';
            } else if (type === 'master') {
                destination = extractMasterCode(currentOrder.master);
                if (!destination) {
                    alert('Мастер не назначен');
                    return;
                }
            }

            const sendId = Date.now();
            let timeLeft = 30;
            button.textContent = timeLeft;
            
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    button.textContent = timeLeft;
                } else {
                    // Timer finished - send message
                    clearInterval(countdown);
                    sendMessage(destination, message);
                    restoreButton(button, type);
                    pendingSends = pendingSends.filter(s => s.id !== sendId);
                }
            }, 1000);

            // Add to pending sends
            pendingSends.push({
                id: sendId,
                type: type,
                destination: destination,
                button: button,
                countdown: countdown
            });
        }

        async function sendMessage(destination, message) {
            try {
                const response = await fetch(`${API_URL}/api/telegram/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_number: currentOrder.order_number,
                        destination: destination,
                        message: message
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    console.log(`✓ Sent to ${destination}`);
                    // Clear fields after successful send
                    clearFields();
                } else {
                    console.error(`Error: ${data.error}`);
                }
            } catch (error) {
                console.error('Send failed:', error);
            }
        }

        function restoreButton(button, type) {
            if (!button) return;
            
            if (type === 'problems') {
                button.textContent = '?';
            } else if (type === 'pricing') {
                button.textContent = '💰';
            } else if (type === 'master') {
                const masterCode = extractMasterCode(currentOrder?.master);
                button.textContent = `➤ ${masterCode || 'Мастер'}`;
            }
        }

        function clearFields() {
            document.getElementById('englishText').value = '';
            document.getElementById('russianText').value = '';
        }

        async function syncNotion() {
            const button = document.querySelector('.sync-button');
            button.classList.add('loading');
            button.textContent = '...';

            try {
                const response = await fetch(`${API_URL}/api/orders/sync-notion`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    console.log(`✓ Synced: ${data.synced_count} orders`);
                    await loadOrders();
                }
            } catch (error) {
                console.error('Sync failed:', error);
            } finally {
                button.classList.remove('loading');
                button.textContent = 'Sync';
            }
        }
    </script>
</body>
</html>
